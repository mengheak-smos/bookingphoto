<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Calendar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
    html, body {
    height: 100%;
    margin: 0;
    background: #f6f8fc;
    font-family: "Google Sans", sans-serif;
}

body {
    overflow: hidden;
}

.calendar-wrapper {
    height: 100vh;
    padding: 10px;
}

#calendar {
    height: 100%;
    background: #fff;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
}
.calendar-wrapper{
    padding:0;
}
/* Google Calendar style */
.fc {
    font-size: 14px;
}

.fc-toolbar-title {
    font-size: 22px !important;
    font-weight: 400 !important;
    color: #3c4043;
}

.fc-button {
    background: #fff !important;
    color: #3c4043 !important;
    border: 1px solid #dadce0 !important;
    border-radius: 20px !important;
}

.fc-button:hover {
    background: #f1f3f4 !important;
}

.fc-daygrid-day-number {
    color: #3c4043 !important;
    text-decoration: none;
}

.fc-col-header-cell {
    background: white;
}

.fc-event {
    border: none !important;
    border-radius: 12px !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    padding: 2px 8px !important;
    cursor: pointer;
}

.fc-daygrid-event {
    margin-top: 2px !important;
}
.modal {
    z-index: 99999 !important;
}

.modal-backdrop {
    z-index: 99998 !important;
}

.fc-popover {
    z-index: 1000 !important;
}
.app-layout{
    display:flex;
    height:100vh;
}

.sidebar{
    width:280px;
    background:#fff;
    border-right:1px solid #dadce0;
    padding:20px;
    overflow:auto;
}

.calendar-main{
    flex:1;
    background:#fff;
}

.create-btn{
    width:100%;
    border:none;
    background:white;
    padding:14px;
    border-radius:16px;
    box-shadow:
      0 1px 2px rgba(60,64,67,.3),
      0 1px 3px rgba(60,64,67,.15);

    font-size:16px;
    margin-bottom:20px;
}

.mini-calendar{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.filter-section{
    margin-top:20px;
}

.filter-section label{
    display:block;
    margin-bottom:10px;
}
@media(max-width:768px){

    .sidebar{
        display:none;
    }

    .calendar-main{
        width:100%;
    }
}
@media (max-width: 768px) {

    .calendar-wrapper {
        padding: 4px;
    }

    .fc-toolbar {
        flex-direction: column;
        gap: 5px;
    }

    .fc-toolbar-title {
        font-size: 16px !important;
    }

    .fc-button {
        font-size: 12px !important;
    }
}
        .google-modal{
    border:none;
    border-radius:28px;
}

.google-modal .modal-body{
    min-height:300px;
}

.event-color{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#c0ca33;
}
.calendar-header{
    height:64px;
    border-bottom:1px solid #dadce0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:white;
}
</style>
</head>
<body>
<!-- Event Details Modal -->
 <!-- <div class="calendar-header">

    <h4>Booking Calendar</h4>

    <div>
        <button class="btn btn-light">Today</button>
    </div> -->

</div>

<div id="calendar"></div>
<div class="modal fade" id="eventModal">
<div class="modal-dialog modal-lg modal-dialog-centered">

<div class="modal-content google-modal">

<div class="modal-body p-4">

    <div class="d-flex align-items-center mb-4">
        <div class="event-color"></div>

        <div class="ms-3">
            <h3 id="modalEvent"
                class="mb-1"></h3>

            <small id="modalDate"></small>
        </div>
    </div>

    <div class="mb-3">
        📍 <span id="modalLocation"></span>
    </div>

    <div class="mb-3">
        👤 <span id="modalPhotographer"></span>
    </div>

    <div class="mb-3">
    📝
    <div id="modalDescription" style="white-space: pre-wrap;"></div>
</div>

</div>

</div>
</div>
</div>


<div class="app-layout">
    <aside class="sidebar">
        <button class="create-btn">
            + create
        </button>

        <div class="mini-calender">
            <h6>June 2026</h6>
        </div>

        <div class="filter-section">
            Calender
        </div>

        <label for="">
            <input type="checkbox" checked>
            Events
        </label>

        <label for="">
            <input type="checkbox" checked>
            Photographer
        </label>

        <label for="">
            <input type="checkbox" checked>
            Meetings
        </label>
    </aside>
    <main class="calender-main">
        <div id="calender"></div>
    </main>
</div>



<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {

    const calendarEl = document.getElementById('calendar');


      const calendar = new FullCalendar.Calendar(calendarEl, {

    initialView: window.innerWidth < 768
        ? 'timeGridDay'
        : 'dayGridMonth',

    height: '100%',
    expandRows: true,

    fixedWeekCount: false,
    showNonCurrentDates: false,
    navLinks: true,
    nowIndicator: true,

    dayMaxEvents: 4,
    dayMaxEventRows: true,
    moreLinkClick: 'popover',

    headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },

    events: 'https://script.google.com/macros/s/AKfycbxCHYYzDZS39vL_REgx_uWXJspnhtlr5sQHQEl_XHN2a5aRym-h8YxpnB7RwvOiusdp/exec',

    eventContent: function(arg) {
    return {
        html: `
        <div style="
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        ">
            ${arg.event.extendedProps.photographer || 'Unknown'} . ${arg.event.title}
        </div>
        `
    };
},

    eventClick: function(details) {

    // Close FullCalendar popover first
    document.body.click();

    const p = details.event.extendedProps;
    document.getElementById('modalLocation').textContent =
    p.location || "N/A";
    document.getElementById('modalEvent').textContent =
        details.event.title || "N/A";

    document.getElementById('modalPhotographer').textContent =
        p.photographer || "N/A";

    document.getElementById('modalDescription').textContent =
        p.description || "N/A";
    document.getElementById('modalDate').innerText =
    details.event.start.toLocaleString();
    setTimeout(() => {
        const modal = new bootstrap.Modal(
            document.getElementById('eventModal')
        );
        modal.show();
    }, 100);
}

});

    //  THIS WAS MISSING (IMPORTANT)
    calendar.render();

    //sent
    setInterval(() => {
    calendar.refetchEvents();
}, 30000);

    // optional: auto refresh view when rotate/resize
    window.addEventListener('resize', function () {
        const newView = window.innerWidth < 768 ? 'timeGridDay' : 'dayGridMonth';
        calendar.changeView(newView);
    });

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
