<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Calendar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

    <style>
    html, body {
    height: 100%;
    margin: 0;
    background: #f6f8fc;
    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
}

.calendar-wrapper {
    height: 100vh;
    padding: 10px;
}

#calendar {
    height: 100%;
    background: #fff;
    border-radius: 16px;
    padding: 10px;
    box-shadow:
        0 1px 2px rgba(60,64,67,.3),
        0 1px 3px rgba(60,64,67,.15);
}

/* Google Calendar style */
.fc {
    font-size: 14px;
}

.fc-toolbar-title {
    font-size: 22px !important;
    font-weight: 400 !important;
    color: #3c4043;
}

.fc-button {
    background: #fff !important;
    color: #3c4043 !important;
    border: 1px solid #dadce0 !important;
    border-radius: 20px !important;
}

.fc-button:hover {
    background: #f1f3f4 !important;
}

.fc-daygrid-day-number {
    color: #3c4043 !important;
    text-decoration: none;
}

.fc-col-header-cell {
    background: white;
}

.fc-event {
    border: none !important;
    border-radius: 6px !important;
    padding: 1px 4px !important;
    font-size: 11px !important;
}

.fc-day-today {
    background: #e8f0fe !important;
}

@media (max-width: 768px) {

    .calendar-wrapper {
        padding: 4px;
    }

    .fc-toolbar {
        flex-direction: column;
        gap: 5px;
    }

    .fc-toolbar-title {
        font-size: 16px !important;
    }

    .fc-button {
        font-size: 12px !important;
    }
}
</style>
</head>
<!-- Event Details Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Booking Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-2">
          <strong>Event:</strong>
          <div id="modalEvent"></div>
        </div>

        <div class="mb-2">
          <strong>Photographer:</strong>
          <div id="modalPhotographer"></div>
        </div>

        <div class="mb-2">
          <strong>Description:</strong>
          <div id="modalDescription" style="white-space: pre-wrap;"></div>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary"
                data-bs-dismiss="modal">
          Close
        </button>

        <button class="btn btn-primary"
                onclick="copyDetails()">
          Copy
        </button>
      </div>

    </div>
  </div>
</div>
<body>

<div class="container-fluid calendar-wrapper">
    <div class="row h-100">
        <div class="col-12 h-100">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<!-- <div id="details"
     style="white-space: pre-wrap;
            margin-top:20px;
            border:1px solid #ccc;
            padding:15px;">
</div> -->

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {

    const calendarEl = document.getElementById('calendar');

//     const calendar = new FullCalendar.Calendar(calendarEl, {

//         initialView: window.innerWidth < 768 ? 'timeGridDay' : 'dayGridMonth',

//         height: '100%',
//         expandRows: true,
//         handleWindowResize: true,

//         headerToolbar: {
//             left: 'prev,next today',
//             center: 'title',
//             right: 'dayGridMonth,timeGridWeek,timeGridDay'
//         },

//         events: 'https://script.google.com/macros/s/AKfycbzQ_GrjmANTVlCtxqmDAF0IahW1z9AywD7YTHIaFy-2tC9J7fLvf7cwwI8pZhu963Sf/exec',

//         eventClick: function(details) {
//     alert(
//         "Event: " + details.event.title +
//         "\nPhotographer: " + (details.event.extendedProps.photographer || "") +
//         "\nDescription: " + (details.event.extendedProps.description || "")
//     );
// }
//     }); 
      const calendar = new FullCalendar.Calendar(calendarEl, {

    initialView: window.innerWidth < 768
        ? 'timeGridDay'
        : 'dayGridMonth',

    height: '100%',
    expandRows: true,

    fixedWeekCount: false,
    showNonCurrentDates: false,
    navLinks: true,
    nowIndicator: true,

    dayMaxEvents: 4,
    dayMaxEventRows: true,
    moreLinkClick: 'popover',

    headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },

    events: 'https://script.google.com/macros/s/AKfycbxCHYYzDZS39vL_REgx_uWXJspnhtlr5sQHQEl_XHN2a5aRym-h8YxpnB7RwvOiusdp/exec',

    eventContent: function(arg) {
        return {
            html: `
                <div style="
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    font-size:11px;
                    font-weight:600;
                ">
                    📸 ${arg.event.extendedProps.photographer || 'Unknown'}
                    •
                    ${arg.event.title}
                </div>
            `
        };
    },

    eventClick: function(details) {

    const p = details.event.extendedProps;

    document.getElementById('modalEvent').textContent =
        details.event.title || "N/A";

    document.getElementById('modalPhotographer').textContent =
        p.photographer || "N/A";

    document.getElementById('modalDescription').textContent =
        p.description || "N/A";

    window.copyText =
`Event: ${details.event.title || "N/A"}
Photographer: ${p.photographer || "N/A"}
Description: ${p.description || "N/A"}`;

    const modal =
        new bootstrap.Modal(
            document.getElementById('eventModal')
        );

    modal.show();
}

});

    //  THIS WAS MISSING (IMPORTANT)
    calendar.render();

    // optional: auto refresh view when rotate/resize
    window.addEventListener('resize', function () {
        const newView = window.innerWidth < 768 ? 'timeGridDay' : 'dayGridMonth';
        calendar.changeView(newView);
    });

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
